<title>Fábrica IA 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa + panel narrativo flotante + barra de capítulos */
:root{
  --bg:#0B1526; --panel:rgba(11,21,38,.86); --fg:#EEF3F8; --muted:#9AAAC2;
  --teal:#14B8A6; --amber:#E8962E; --blue:#5B7CFA; --coral:#D9465F; --line:rgba(154,170,194,.25);
  --display:"Space Grotesk",Arial,sans-serif; --body:"Inter",Calibri,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.panel{position:fixed;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  width:min(440px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .35s}
.panel.fade{opacity:0}
.kicker{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0 0 10px}
h1{font:700 24px/1.15 var(--display);margin:0 0 10px;text-wrap:balance}
.panel p{margin:0;color:#C9D3E2;font-size:14.5px;line-height:1.55}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ba div{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.4;min-width:0}
.ba b{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.ba .antes{background:rgba(232,150,46,.12);color:#F3D2A6}.ba .antes b{color:var(--amber)}
.ba .despues{background:rgba(20,184,166,.12);color:#B5EDE6}.ba .despues b{color:var(--teal)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:14px;background:linear-gradient(to top,rgba(11,21,38,.95),rgba(11,21,38,0))}
button{font:600 13px var(--body);color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;
  height:40px;min-width:40px;padding:0 14px;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#play{background:var(--teal);border-color:var(--teal);color:#062823;min-width:96px}
.dots{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding:4px 0}
.dot{flex:1;min-width:22px;height:40px;border:0;background:none;padding:0;border-radius:6px;position:relative}
.dot::before{content:"";position:absolute;left:0;right:0;top:18px;height:4px;border-radius:2px;background:rgba(154,170,194,.3)}
.dot .fill{position:absolute;left:0;top:18px;height:4px;border-radius:2px;background:var(--teal);width:0}
.dot.done .fill{width:100%}
.dot span{position:absolute;left:0;right:0;top:26px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.dot.on span{color:var(--fg)}
.hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(20px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(20px,env(safe-area-inset-left,0px));font:700 14px var(--display);letter-spacing:.02em}
.brand em{font-style:normal;color:var(--teal)}
@media (max-width:640px){
  .panel{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);padding:14px 16px;left:16px;width:calc(100vw - 32px)}
  h1{font-size:19px}.panel p{font-size:13px}.ba{display:none}.dot span{display:none}.hint{display:none}
  button{padding:0 10px}#play{min-width:74px}
}
</style>

<canvas id="scene" aria-label="Animación 3D: evolución del trabajo con IA"></canvas>
<div class="brand">IA · <em>de asistente a sistema</em></div>
<div class="hint">Arrastra para girar · rueda para acercar · ← → para navegar</div>

<section class="panel" id="panel" aria-live="polite">
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
  <p id="body"></p>
  <div class="ba"><div class="antes"><b>Hoy</b><span id="antes"></span></div><div class="despues"><b>Hacia dónde</b><span id="despues"></span></div></div>
</section>

<nav class="bar" aria-label="Capítulos">
  <button id="prev" aria-label="Capítulo anterior">←</button>
  <button id="play">❚❚ Pausa</button>
  <button id="next" aria-label="Capítulo siguiente">→</button>
  <div class="dots" id="dots"></div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const CH = [
  {k:"Introducción", t:"De la IA como asistente a la IA como sistema", s:null,
   b:"Un recorrido por siete estaciones: cómo trabajamos hoy con la IA, dónde se nos escapa el tiempo y cómo convertir la IA en un sistema que trabaja en paralelo, 24 horas y con todo el contexto.",
   a:"La IA ejecuta tareas sueltas dentro del flujo de siempre.", d:"La IA como sistema: servidores, coordinador, contexto y entrega automática."},
  {k:"01 · Dónde estamos", t:"La IA ya trabaja dentro de nuestro flujo", s:0,
   b:"Cada persona plantea el proyecto, recaba la información y pide a la IA que haga el trabajo en su equipo local. Fíjate en el reloj: cuando la persona se va, el portátil se apaga y la IA se detiene con él.",
   a:"Equipo local encendido solo en horario laboral.", d:"Delegar trabajo que siga avanzando fuera del horario."},
  {k:"01 · Dónde estamos", t:"Hormas con DASS: el 90 % estaba en junio", s:1,
   b:"El bloque verde es el desarrollo con IA, terminado en junio. La barra ámbar son seis meses de migraciones y reuniones: el anillo gira en ciclos de “¿cómo lo quieres?”. El cuello de botella ya no es programar, es entender al cliente.",
   a:"Requisitos y datos reales llegan al final.", d:"Mover la incertidumbre al principio del proyecto."},
  {k:"01 · Metodología", t:"Seis pasos antes de construir", s:2,
   b:"Grabar la reunión inicial, que la IA proponga, criticar y grabar la revisión, prototipar con documentación técnica y presupuesto, presentar al cliente y, con el presupuesto aprobado, construir. Piloto: FRILESA, con Vanessa.",
   a:"Construir primero y concretar después.", d:"Entender, proponer y solo entonces construir."},
  {k:"Frente 1 · Equipos locales", t:"Servidores: la IA sigue cuando nos vamos", s:3,
   b:"Las cuatro personas trabajan sobre el servidor. Al caer la noche se marchan, pero las IAs que orbitan el servidor siguen trabajando. Requiere capacidad para 4 personas en continuo; ya lo hacemos en la migración de Trazas con Arturo.",
   a:"≈ 9 h de trabajo útil al día.", d:"Hasta 24 h de avance por proyecto."},
  {k:"Frentes 3, 4 y 5 · Contexto", t:"Correo, Slack y reuniones alimentan a la IA", s:4,
   b:"Correos, mensajes y reuniones grabadas fluyen a una base de conocimiento viva por proyecto. La IA estructura requisitos y dudas, detecta contradicciones, prepara las preguntas para el cliente y propone el plan con los huecos que faltan. Nosotros validamos.",
   a:"Personas que leen, interpretan y trasladan a mano.", d:"La IA recibe el contexto completo y en tiempo real."},
  {k:"Frentes 2 y 6 · Coordinación", t:"Un coordinador para todos los proyectos", s:5,
   b:"Una sola conversación reparte el trabajo entre varias IAs y sigue su estado. Cuando una se bloquea (rojo), el coordinador te trae la pregunta concreta con su contexto; tú decides y el trabajo continúa. También redacta y envía peticiones por correo o Slack tras tu aprobación.",
   a:"Una persona mirando una conversación que espera.", d:"Te avisa solo cuando te necesita."},
  {k:"Frente 7 · Despliegue", t:"Del cambio aprobado al cliente, sin pasos manuales", s:6,
   b:"Trazas: cada cambio aprobado se construye, se prueba y se publica automáticamente. Aplicaciones propias: el mismo contenedor Docker se instala igual en cualquier cliente. La IA deja la tarea terminada y desplegada; la persona revisa y aprueba.",
   a:"Despliegue manual y distinto en cada proyecto.", d:"Despliegue continuo y Docker como estándar."},
  {k:"Cierre", t:"Un sistema: la persona decide, la IA ejecuta", s:null,
   b:"Las estaciones quedan conectadas: información completa, plan de la IA, trabajo 24 h en paralelo y entrega automática. Próximos pasos: piloto FRILESA, extender el trabajo en servidor, conectar correo y Slack, montar el coordinador y estandarizar el despliegue.",
   a:"La persona ejecuta y transmite información.", d:"La persona decide, valida y aprueba."},
];
const SHORT = ["Inicio","Flujo actual","Hormas DASS","Metodología","Servidores 24 h","Contexto","Coordinador","Despliegue","Cierre"];

// ---------- renderer / escena ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B1526);
scene.fog = new THREE.Fog(0x0B1526, 60, 190);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xbcd3ff, 0x0b1526, 0.75));
const sunL = new THREE.DirectionalLight(0xffffff, 0.9);
sunL.position.set(30, 50, 30); sunL.castShadow = true;
sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, {left:-140, right:140, top:60, bottom:-60, far:200});
scene.add(sunL); scene.add(sunL.target);

const COL = {teal:0x14B8A6, amber:0xE8962E, blue:0x5B7CFA, coral:0xD9465F, navy:0x1F2F4D, slate:0x34425C, light:0xEEF3F8, muted:0x9AAAC2, ground:0x0F1C30};
const mat = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.55, metalness:.1}, o));
const glow = (c, i=1.2) => new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:i, roughness:.4});
function mesh(geo, m, x=0, y=0, z=0, parent){ const o = new THREE.Mesh(geo, m); o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true; if(parent) parent.add(o); return o; }
const box = (w,h,d) => new THREE.BoxGeometry(w,h,d);
const sph = (r) => new THREE.SphereGeometry(r, 24, 16);

function label(text, color="#EEF3F8", size=1, bg="rgba(11,21,38,.78)"){
  const c = document.createElement("canvas"), g = c.getContext("2d"), fs = 44;
  g.font = `600 ${fs}px Inter, Arial, sans-serif`;
  const w = Math.ceil(g.measureText(text).width) + 44; c.width = w; c.height = 76;
  g.font = `600 ${fs}px Inter, Arial, sans-serif`;
  g.fillStyle = bg; const r = 26; g.beginPath(); g.moveTo(r,0); g.arcTo(w,0,w,76,r); g.arcTo(w,76,0,76,r); g.arcTo(0,76,0,0,r); g.arcTo(0,0,w,0,r); g.fill();
  g.fillStyle = color; g.textBaseline = "middle"; g.fillText(text, 22, 40);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthWrite:false}));
  s.scale.set(size * w / 76 * 0.6, size * 0.6, 1);
  s.userData = {canvas:c, ctx:g, tex, text};
  return s;
}
function setLabel(s, text, color){
  if (s.userData.text === text) return; s.userData.text = text;
  const fresh = label(text, color); s.material.map.dispose(); s.material.map = fresh.material.map; s.scale.x = fresh.scale.x * (s.scale.y / fresh.scale.y);
}
function person(color=COL.blue){
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(.38,.45,1.3,16), mat(color), 0, .65, 0, g);
  mesh(sph(.32), mat(0xF1D4B8), 0, 1.6, 0, g);
  return g;
}

// suelo
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 300), mat(COL.ground, {roughness:.95}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(600, 150, 0x1F2F4D, 0x15233a); grid.position.y = .01; scene.add(grid);

const SPACING = 34;
const stations = [];
function station(i, build){
  const g = new THREE.Group(); g.position.x = i * SPACING; scene.add(g);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, .2, 64), mat(0x132340, {roughness:.9}));
  pad.position.y = .1; pad.receiveShadow = true; g.add(pad);
  const s = Object.assign({group:g, cam:[0, 9, 19], look:[0, 2.2, 0]}, build(g));
  stations.push(s);
}

// reloj compartido (día de 24 h en 14 s)
const DAY = 14;
const hourAt = (t) => ((t / DAY) * 24 + 7) % 24;
const working = (h) => h >= 8 && h < 17;
function skyOrb(g, r=9){
  const sun = mesh(sph(.7), glow(0xFFD27A, 1.4), 0, 0, 0, g);
  return (t) => { const h = hourAt(t), a = ((h - 6) / 24) * Math.PI * 2;
    sun.position.set(Math.cos(a) * -r, 2 + Math.sin(a) * 7, -6);
    const day = working(h) || (h >= 6 && h < 20);
    sun.material.color.set(day ? 0xFFD27A : 0xC9D6FF); sun.material.emissive.set(day ? 0xFFB347 : 0x8FA3FF); };
}

// ===== Estación 0: flujo actual en equipo local =====
station(0, (g) => {
  mesh(box(6, .25, 3), mat(0x2B3A55), 0, 1.6, 0, g);
  [[-2.7,-1.2],[2.7,-1.2],[-2.7,1.2],[2.7,1.2]].forEach(([x,z]) => mesh(box(.2,1.5,.2), mat(0x2B3A55), x, .8, z, g));
  mesh(box(2.2, .1, 1.5), mat(0x9AAAC2, {metalness:.5}), 0, 1.78, .1, g);
  const screen = mesh(box(2.2, 1.4, .07), glow(COL.teal, .9), 0, 2.5, -.7, g); screen.rotation.x = -.15;
  const p = person(COL.blue); p.position.set(0, 0, 2.6); g.add(p);
  const orb = mesh(sph(.38), glow(COL.teal, 1.6), 0, 4, -.3, g);
  const tag = label("09:00 · trabajando", "#14B8A6", 1.1); tag.position.set(0, 6.4, 0); g.add(tag);
  const lab = label("Equipo local", "#EEF3F8", .9); lab.position.set(-4.5, 3.6, 0); g.add(lab);
  const sky = skyOrb(g);
  const steps = ["Plantear","Recabar","Pedir a la IA"];
  steps.forEach((s,i) => { const l = label(s, i===2 ? "#14B8A6" : "#9AAAC2", .7); l.position.set(-6 + i*6, .9, 6); g.add(l); });
  return { update(t){
    sky(t); const h = hourAt(t), on = working(h);
    screen.material.emissiveIntensity = on ? .9 : 0; screen.material.color.set(on ? COL.teal : 0x101827);
    orb.visible = on; orb.position.y = 4 + Math.sin(t * 3) * .25; orb.rotation.y = t;
    const k = on ? 1 : 0; p.scale.setScalar(THREE.MathUtils.lerp(p.scale.x, k || .001, .08));
    setLabel(tag, `${String(Math.floor(h)).padStart(2,"0")}:00 · ${on ? "IA trabajando" : "equipo apagado"}`, on ? "#14B8A6" : "#E8962E");
  }};
});

// ===== Estación 1: Hormas DASS / cuello de botella =====
station(1, (g) => {
  const months = ["Jun","Jul","Ago","Sep","Oct","Nov","Dic"], mw = 2.6, x0 = -7.8;
  months.forEach((m,i) => { const l = label(m, "#9AAAC2", .7); l.position.set(x0 + i*mw, .7, 4.2); g.add(l);
    mesh(box(mw - .15, .06, 6), mat(i===0 ? 0x16354A : 0x1A2A44), x0 + i*mw, .23, 0, g); });
  const dev = mesh(box(mw - .4, 1, 2), glow(COL.teal, .35), x0, .7, -1, g);
  const devL = label("90 % con IA", "#14B8A6", .8); devL.position.set(x0, 5.4, -1); g.add(devL);
  const len = (months.length - 1) * mw;
  const mig = mesh(box(1, .8, 1.6), glow(COL.amber, .25), 0, .65, 1.2, g);
  const migL = label("+6 meses: migraciones y reuniones", "#E8962E", .8); migL.position.set(x0 + mw + len/2 - mw/2, 2.2, 2.6); g.add(migL);
  const ring = new THREE.Group(); g.add(ring);
  mesh(new THREE.TorusGeometry(1.6, .14, 16, 64), glow(COL.coral, .5), 0, 0, 0, ring);
  const token = mesh(sph(.32), glow(0xFFFFFF, 1), 0, 0, 0, ring);
  const q = label("¿Cómo lo quieres?", "#F3B3BF", .75); q.position.set(0, 2.6, 0); ring.add(q);
  return { cam:[0, 8, 18], look:[0, 2, 0], update(t, enter){
    const e = Math.min(enter / 2.5, 1);
    dev.scale.y = THREE.MathUtils.lerp(.1, 4.2, Math.min(enter/1.2,1)); dev.position.y = .25 + dev.scale.y/2;
    const L = Math.max(.01, len * e); mig.scale.x = L; mig.position.x = x0 + mw/2 + L/2 + .1;
    const p = ((t * .08) % 1);
    ring.position.set(x0 + mw + p * (len - mw), 2.6, 1.2);
    token.position.set(Math.cos(t*4)*1.6, Math.sin(t*4)*1.6, 0);
    ring.rotation.y = .3;
  }};
});

// ===== Estación 2: metodología 6 pasos =====
station(2, (g) => {
  const names = ["1 Grabar","2 Proponer","3 Criticar","4 Prototipar","5 Presentar","6 Construir"];
  const cols = [COL.blue,COL.blue,COL.blue,COL.amber,COL.amber,COL.teal];
  const pos = names.map((n,i) => { const h = .6 + i*.75, x = -8.5 + i*3.4;
    mesh(box(2.8, h, 2.8), mat(cols[i]), x, h/2 + .2, 0, g);
    const l = label(n, "#EEF3F8", .7); l.position.set(x, h + 1.9, 1.6); g.add(l);
    return new THREE.Vector3(x, h + .2 + .45, 0); });
  const doc = mesh(box(.7, .9, .12), glow(0xFFFFFF, .6), 0, 0, 0, g);
  const pilot = label("Piloto: FRILESA", "#14B8A6", .9); pilot.position.set(0, 7.6, -2); g.add(pilot);
  return { cam:[0, 9, 20], look:[0, 2.6, 0], update(t){
    const T = 1.3, k = Math.floor(t / T) % 7, f = (t % T) / T;
    const a = pos[Math.min(k,5)], b = pos[Math.min(k+1,5)];
    if (k >= 5) { doc.position.copy(pos[5]); doc.position.y += .2 + Math.sin(t*6)*.1; doc.rotation.y += .08; }
    else { const e = f < .5 ? 0 : (f - .5) * 2; doc.position.lerpVectors(a, b, e); doc.position.y += Math.sin(e*Math.PI) * 1.4; doc.rotation.y = t; }
    doc.material.color.set(k >= 5 ? COL.teal : 0xFFFFFF); doc.material.emissive.set(k >= 5 ? COL.teal : 0xffffff);
  }};
});

// ===== Estación 3: servidores 24 h =====
station(3, (g) => {
  mesh(box(3, 6, 2.4), mat(0x1A2740, {metalness:.4}), 0, 3.2, -1, g);
  const leds = [];
  for (let r=0;r<10;r++) for (let c=0;c<4;c++) { const l = mesh(box(.28,.12,.05), glow(COL.teal, 1.5), -.9 + c*.6, .9 + r*.52, .23, g); l.castShadow = false; leds.push(l); }
  const people = [];
  for (let i=0;i<4;i++){ const p = person([COL.blue,0x7A8CFF,COL.blue,0x7A8CFF][i]); const a = -0.9 + i*.6; p.position.set(Math.sin(a)*5.2, 0, Math.cos(a)*5.2 - 1); p.lookAt(0,0,-1); g.add(p); people.push(p); }
  const agents = [];
  for (let i=0;i<6;i++){ const o = mesh(sph(.33), glow(i%2?COL.teal:COL.blue, 1.6), 0,0,0, g); agents.push(o); }
  const tag = label("09:00", "#EEF3F8", 1.1); tag.position.set(0, 8.6, -1); g.add(tag);
  const lab = label("4 personas · 1 servidor", "#9AAAC2", .8); lab.position.set(0, .8, 5.6); g.add(lab);
  const sky = skyOrb(g, 10);
  return { update(t){
    sky(t); const h = hourAt(t), on = working(h);
    leds.forEach((l,i) => l.material.emissiveIntensity = (Math.sin(t*9 + i*1.7) > 0 ? 1.8 : .3));
    agents.forEach((o,i) => { const a = t*(.8 + i*.08) + i*Math.PI/3, r = 3 + (i%3)*.6; o.position.set(Math.cos(a)*r, 2.2 + i*.7 + Math.sin(t*2+i)*.2, Math.sin(a)*r - 1); });
    people.forEach((p) => p.scale.setScalar(THREE.MathUtils.lerp(p.scale.x, on ? 1 : .001, .08)));
    setLabel(tag, `${String(Math.floor(h)).padStart(2,"0")}:00 · ${on ? "personas + IA" : "la IA sigue sola"}`, on ? "#14B8A6" : "#5B7CFA");
  }};
});

// ===== Estación 4: contexto (comunicación + base de conocimiento) =====
station(4, (g) => {
  const core = new THREE.Group(); core.position.set(1.5, 3.6, 0); g.add(core);
  const shell = mesh(new THREE.IcosahedronGeometry(2.1, 1), new THREE.MeshStandardMaterial({color:COL.teal, emissive:COL.teal, emissiveIntensity:.5, wireframe:true}), 0,0,0, core);
  const inner = mesh(new THREE.IcosahedronGeometry(1.2, 0), glow(COL.teal, .8), 0,0,0, core);
  const kb = label("Base de conocimiento viva", "#14B8A6", .85); kb.position.set(1.5, 6.6, 0); g.add(kb);
  const src = [
    {name:"Correo", p:new THREE.Vector3(-8, 2.2, -3.5), c:COL.amber},
    {name:"Slack", p:new THREE.Vector3(-8.6, 2.2, .3), c:0xB06BFF},
    {name:"Reuniones", p:new THREE.Vector3(-8, 2.2, 4), c:COL.blue},
  ];
  src.forEach((s) => {
    if (s.name === "Correo") { mesh(box(1.8, 1.2, .15), mat(0xEEF3F8), s.p.x, s.p.y, s.p.z, g); }
    else if (s.name === "Slack") { [[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]].forEach(([a,b],i) => mesh(box(.45,.45,.45), glow([0x36C5F0,0x2EB67D,0xECB22E,0xE01E5A][i], .4), s.p.x+a, s.p.y+b, s.p.z, g)); }
    else { mesh(new THREE.CylinderGeometry(.18,.18,1.2,16), mat(0x9AAAC2), s.p.x, s.p.y - .7, s.p.z, g); mesh(sph(.45), mat(0x34425C), s.p.x, s.p.y + .1, s.p.z, g); }
    const l = label(s.name, "#EEF3F8", .7); l.position.set(s.p.x, s.p.y + 1.6, s.p.z); g.add(l);
  });
  const ai = mesh(sph(.6), glow(COL.blue, 1.4), 8, 3.6, 0, g);
  const aiL = label("IA: plan + preguntas", "#5B7CFA", .75); aiL.position.set(8, 5.2, 0); g.add(aiL);
  const parts = [];
  for (let i=0;i<24;i++){ const s = src[i%3]; const o = mesh(i%3===0 ? box(.4,.28,.05) : sph(.16), glow(s.c, 1), 0,0,0, g); o.castShadow=false; parts.push({o, s, off:i/24}); }
  const beam = []; for (let i=0;i<8;i++){ const o = mesh(sph(.12), glow(COL.teal, 1.6), 0,0,0, g); o.castShadow=false; beam.push(o); }
  const target = new THREE.Vector3(1.5, 3.6, 0);
  return { cam:[0, 9, 20], look:[0, 2.8, 0], update(t){
    shell.rotation.y = t*.3; shell.rotation.x = t*.15; inner.rotation.y = -t*.6;
    const pulse = 1 + Math.sin(t*3)*.05; core.scale.setScalar(pulse);
    parts.forEach((p) => { const f = (t*.35 + p.off) % 1; const mid = p.s.p.clone().lerp(target, .5); mid.y += 2.5;
      const a = p.s.p.clone().lerp(mid, f), b = mid.clone().lerp(target, f); p.o.position.copy(a.lerp(b, f)); p.o.rotation.y = t*2; p.o.scale.setScalar(1 - f*.6); });
    beam.forEach((o,i) => { const f = (t*.6 + i/8) % 1; o.position.set(THREE.MathUtils.lerp(3.6, 7.4, f), 3.6, 0); });
    ai.position.y = 3.6 + Math.sin(t*2)*.2;
  }};
});

// ===== Estación 5: coordinador =====
station(5, (g) => {
  const hub = mesh(sph(1.1), glow(COL.teal, 1.1), 0, 4, 0, g);
  const hubL = label("Coordinador", "#14B8A6", .85); hubL.position.set(0, 5.9, 0); g.add(hubL);
  const nodes = [], lines = [];
  for (let i=0;i<5;i++){ const a = -Math.PI*.9 + i*(Math.PI*.45);
    const p = new THREE.Vector3(Math.cos(a)*7, 1.6, Math.sin(a)*5 - 1.5);
    const n = mesh(new THREE.OctahedronGeometry(.7), glow(COL.teal, .9), p.x, p.y, p.z, g); nodes.push(n);
    const l = label("IA proyecto " + "ABCDE"[i], "#EEF3F8", .6); l.position.set(p.x, p.y + 1.4, p.z); g.add(l);
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,4,0), p]);
    const ln = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x5D6F8C})); g.add(ln); lines.push(ln); }
  const mail = mesh(box(1,.7,.1), mat(0xEEF3F8), -2.6, 6.2, -1.5, g); const slack = mesh(box(.7,.7,.7), glow(0xB06BFF, .5), 2.6, 6.2, -1.5, g);
  [mail, slack].forEach((o) => { const geo = new THREE.BufferGeometry().setFromPoints([o.position.clone(), new THREE.Vector3(0,4,0)]); g.add(new THREE.Line(geo, new THREE.LineDashedMaterial({color:0x9AAAC2, dashSize:.3, gapSize:.2})).computeLineDistances()); });
  const you = person(COL.blue); you.position.set(0, 0, 6.5); g.add(you);
  const youL = label("Tú", "#5B7CFA", .7); youL.position.set(0, 2.6, 6.5); g.add(youL);
  const ring = mesh(new THREE.TorusGeometry(.9, .07, 8, 40), glow(COL.blue, 1.5), 0, .12, 6.5, g); ring.rotation.x = Math.PI/2;
  const pulses = nodes.map(() => { const o = mesh(sph(.18), glow(0xFFFFFF, 1.5), 0,0,0, g); o.castShadow = false; return o; });
  const alert = mesh(sph(.28), glow(COL.coral, 2), 0,0,0, g); alert.castShadow = false;
  const alertL = label("¿Decisión? → Tú", "#F3B3BF", .7); g.add(alertL);
  const hubP = new THREE.Vector3(0,4,0), youP = new THREE.Vector3(0,2,6.5);
  return { cam:[0, 10, 19], look:[0, 2.6, 0], update(t){
    hub.rotation.y = t; const C = 7, cyc = t % C, bi = Math.floor(t / C) % 5;
    nodes.forEach((n,i) => { n.rotation.y = t*1.5 + i; const blocked = i === bi && cyc > 1 && cyc < 5;
      n.material.color.set(blocked ? COL.coral : COL.teal); n.material.emissive.set(blocked ? COL.coral : COL.teal);
      const f = (t*.7 + i*.2) % 1; pulses[i].visible = !blocked; pulses[i].position.lerpVectors(hubP, n.position, f); });
    const showA = cyc > 1 && cyc < 5; alert.visible = alertL.visible = showA;
    if (showA) { const f = (cyc - 1) / 4; const np = nodes[bi].position;
      if (f < .5) alert.position.lerpVectors(np, hubP, f*2); else alert.position.lerpVectors(hubP, youP, (f-.5)*2);
      alertL.position.copy(alert.position).add(new THREE.Vector3(0, 1, 0)); }
    const lit = cyc > 3 && cyc < 5.5; ring.material.emissiveIntensity = lit ? 2.5 : .2; ring.scale.setScalar(lit ? 1 + Math.sin(t*8)*.1 : 1);
  }};
});

// ===== Estación 6: despliegue =====
station(6, (g) => {
  mesh(box(20, .5, 2.4), mat(0x2B3A55), 0, .5, -1.6, g);
  const gates = [["Construir",-5],["Probar",0],["Publicar",5]];
  const gm = gates.map(([n,x]) => { const a = new THREE.Group(); a.position.set(x, 0, -1.6); g.add(a);
    mesh(box(.3, 3.4, .3), mat(0x9AAAC2), -1.4, 1.7, 0, a); mesh(box(.3, 3.4, .3), mat(0x9AAAC2), 1.4, 1.7, 0, a);
    const top = mesh(box(3.1, .35, .5), glow(COL.teal, .5), 0, 3.4, 0, a);
    const l = label(n, "#EEF3F8", .7); l.position.set(0, 4.3, 0); a.add(l); return top; });
  const client = new THREE.Group(); client.position.set(12, 0, -1.6); g.add(client);
  mesh(box(3, 4.5, 3), mat(0x34425C), 0, 2.25, 0, client);
  for (let r=0;r<3;r++) for (let c=0;c<2;c++) mesh(box(.6,.5,.05), glow(0xFFD27A, .6), -.6 + c*1.2, 1.3 + r*1.1, 1.53, client);
  const cl = label("Cliente", "#EEF3F8", .75); cl.position.set(0, 5.4, 0); client.add(cl);
  const boxes = []; for (let i=0;i<5;i++){ const b = new THREE.Group(); g.add(b);
    mesh(box(1.5, 1, 1), glow(COL.blue, .25), 0, 0, 0, b); for (let k=-2;k<=2;k++) mesh(box(.06, 1.02, 1.02), mat(0x3A55C8), k*.3, 0, 0, b); boxes.push(b); }
  const dk = label("Mismo contenedor Docker → cualquier cliente", "#5B7CFA", .75); dk.position.set(0, .9, 3.2); g.add(dk);
  const clients = [-4, 0, 4].map((x) => { const c = new THREE.Group(); c.position.set(x, 0, 5.5); g.add(c);
    mesh(box(1.6, 1.8, 1.4), mat(0x34425C), 0, .9, 0, c); const k = mesh(box(.9,.6,.6), glow(COL.blue, .3), 0, 2.2, 0, c); return k; });
  return { cam:[1, 9, 19], look:[1, 2, 0], update(t){
    boxes.forEach((b,i) => { const f = (t*.09 + i/5) % 1; const x = -10 + f*21; b.position.set(x, 1.3, -1.6);
      const inC = x > 10.5; b.visible = !inC; });
    gm.forEach((top,i) => { const near = boxes.some((b) => Math.abs(b.position.x - gates[i][1]) < .9); top.material.emissiveIntensity = near ? 2 : .4; });
    clients.forEach((k,i) => { k.position.y = 2.2 + Math.sin(t*2 + i)*.12; k.rotation.y = t*.6; });
  }};
});

// camino que une las estaciones (el "sistema")
const pathPts = []; for (let i=0;i<stations.length;i++) pathPts.push(new THREE.Vector3(i*SPACING, .3, 9));
const pathGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
const path = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({color:COL.teal, transparent:true, opacity:.15})); scene.add(path);
const travelers = []; for (let i=0;i<10;i++){ const o = mesh(sph(.35), glow(COL.teal, 2), 0,0,0, scene); o.castShadow=false; travelers.push(o); }
const MIDX = (stations.length - 1) * SPACING / 2;

// ---------- cámara ----------
function viewFor(ch){
  const c = CH[ch];
  if (c.s === null) return { pos:new THREE.Vector3(MIDX, ch === 0 ? 52 : 46, ch === 0 ? 78 : 68), look:new THREE.Vector3(MIDX, 0, 0) };
  const s = stations[c.s], x = s.group.position.x;
  return { pos:new THREE.Vector3(x + s.cam[0], s.cam[1], s.cam[2]), look:new THREE.Vector3(x + s.look[0], s.look[1], s.look[2]) };
}
let cur = 0, enterT = 0;
const camPos = new THREE.Vector3(MIDX, 90, 130), camLook = new THREE.Vector3(MIDX, 0, 0);
let yaw = 0, pitch = 0, zoom = 1, dragging = false, lx = 0, ly = 0, idle = 0;
canvas.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => { if (!dragging) return; yaw -= (e.clientX - lx) * .005; pitch = THREE.MathUtils.clamp(pitch + (e.clientY - ly) * .003, -.35, .5); lx = e.clientX; ly = e.clientY; idle = 0; });
canvas.addEventListener("pointerup", () => dragging = false);
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoom = THREE.MathUtils.clamp(zoom * (1 + e.deltaY * .001), .55, 1.8); idle = 0; }, {passive:false});

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const dotsEl = $("dots"), dots = CH.map((c,i) => { const b = document.createElement("button"); b.className = "dot"; b.setAttribute("aria-label", `Capítulo ${i+1}: ${SHORT[i]}`);
  b.innerHTML = `<i class="fill"></i><span>${SHORT[i]}</span>`; b.onclick = () => go(i, true); dotsEl.appendChild(b); return b; });
let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, chT = 0; const DUR = 13;
function render(){ const c = CH[cur]; $("kicker").textContent = c.k; $("title").textContent = c.t; $("body").textContent = c.b; $("antes").textContent = c.a; $("despues").textContent = c.d;
  dots.forEach((d,i) => { d.classList.toggle("on", i === cur); d.classList.toggle("done", i < cur); d.querySelector(".fill").style.width = i < cur ? "100%" : "0"; }); }
function go(i, user){ const n = (i + CH.length) % CH.length; if (n === cur && !user) return;
  $("panel").classList.add("fade"); setTimeout(() => { render(); $("panel").classList.remove("fade"); }, 250);
  cur = n; enterT = 0; chT = 0; yaw *= .3; pitch *= .3; zoom = 1; }
$("prev").onclick = () => go(cur - 1, true); $("next").onclick = () => go(cur + 1, true);
function setPlay(p){ playing = p; $("play").textContent = p ? "❚❚ Pausa" : "▶ Reproducir"; }
$("play").onclick = () => setPlay(!playing); setPlay(playing);
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(cur + 1, true); else if (e.key === "ArrowLeft") go(cur - 1, true); else if (e.key === " ") { e.preventDefault(); setPlay(!playing); } });
render();

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < 700 ? 60 : 45;
  const sh = w > 900 ? Math.min(380, w * .27) : 0;
  if (sh) camera.setViewOffset(w + sh, h, 0, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------- bucle ----------
const clock = new THREE.Clock(); let T = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05); T += dt; enterT += dt; idle += dt;
  if (playing) { chT += dt; const f = dots[cur].querySelector(".fill"); f.style.width = Math.min(chT / DUR, 1) * 100 + "%"; if (chT >= DUR) go(cur + 1); }
  if (idle > 4 && !dragging) { yaw *= .985; pitch *= .985; }
  const v = viewFor(cur);
  const off = v.pos.clone().sub(v.look).multiplyScalar(zoom);
  off.applyAxisAngle(new THREE.Vector3(0,1,0), yaw + Math.sin(T*.15) * .06);
  off.y += pitch * off.length();
  const k1 = 1 - Math.pow(1 - .035, dt * 60), k2 = 1 - Math.pow(1 - .05, dt * 60);
  camPos.lerp(v.look.clone().add(off), k1); camLook.lerp(v.look, k2);
  camera.position.copy(camPos); camera.lookAt(camLook);
  stations.forEach((s, i) => s.update(T, CH[cur].s === i ? enterT : 99));
  const last = (stations.length - 1) * SPACING, finale = CH[cur].s === null;
  path.material.opacity = THREE.MathUtils.lerp(path.material.opacity, finale ? .9 : .15, .05);
  travelers.forEach((o,i) => { const f = (T * .05 + i / travelers.length) % 1; o.position.set(f * last, .6 + Math.sin(T*3 + i)*.15, 9); o.visible = finale || i % 3 === 0; });
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
frame();
})();
</script>
